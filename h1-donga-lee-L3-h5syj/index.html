<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Social Media Algorithms Daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101a3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: one narrow column, a bridge of planks as the progress motif (9 planks = 9 steps to cross) */
:root {
  --bg: #f3f6f1; --surface: #ffffff; --ink: #1c2822; --muted: #5b6a61; --line: #d9e2da;
  --accent: #2f5fd0; --accent-soft: #e4ebfb; --on-accent: #ffffff;
  --plank: #c98a1b; --plank-soft: #f3e3c3; --plank-empty: #e6ebe4;
  --ok: #1d8549; --ok-soft: #e1f3e8; --bad: #cc3434; --bad-soft: #fbe5e5;
  --shadow: 0 1px 2px rgba(28,40,34,.06), 0 6px 20px rgba(28,40,34,.06);
  --f-display: "Jua", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 14px; --stamp: #c8352b; --stamp-soft: #fdecea;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111613; --surface: #1a211d; --ink: #e6ede8; --muted: #9aa8a0; --line: #2b3530;
  --accent: #7f9fff; --accent-soft: #232d48; --on-accent: #0f1530;
  --plank: #e0a645; --plank-soft: #3d311b; --plank-empty: #28302b;
  --ok: #52c584; --ok-soft: #173325; --bad: #ff7a7a; --bad-soft: #3a1d1d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); --stamp: #ff7b70; --stamp-soft: #3a1f1d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111613; --surface: #1a211d; --ink: #e6ede8; --muted: #9aa8a0; --line: #2b3530;
  --accent: #7f9fff; --accent-soft: #232d48; --on-accent: #0f1530;
  --plank: #e0a645; --plank-soft: #3d311b; --plank-empty: #28302b;
  --ok: #52c584; --ok-soft: #173325; --bad: #ff7a7a; --bad-soft: #3a1d1d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); --stamp: #ff7b70; --stamp-soft: #3a1f1d; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { background: var(--bg) }
body { margin: 0; color: var(--ink); font: 400 16px/1.6 var(--f-body); -webkit-text-size-adjust: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
#app { max-width: 620px; margin: 0 auto; padding-block: 20px 64px }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.en { font-family: var(--f-body); letter-spacing: -.005em }

/* header */
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--muted) }
h1 { font: 400 clamp(30px, 8vw, 40px)/1.1 var(--f-display); margin: 6px 0 4px; text-wrap: balance }
h2 { font: 400 24px/1.2 var(--f-display); margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 0 }
.stack { display: grid; gap: 16px }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0 }
.who { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.who input { flex: 1 1 160px; min-width: 0; font: inherit; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink) }
.who .name { font: 400 22px var(--f-display) }
.weakbox { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--bad-soft) }
.weakbox small { color: var(--muted) }
.weakbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px }
.weakbtns .btn { padding: 8px 12px; min-height: 0 }
.weakbtns .wdone { border-color: var(--ok); color: var(--ok) }
.rc-weak { margin-top: 10px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline }
.rc-weak .no { color: var(--bad); font-weight: 600 }
.rc-weak .ok { color: var(--ok); font-weight: 600 }
.rc-weak small { font-weight: 400; color: var(--muted) }
.whochips { display: flex; flex-wrap: wrap; gap: 8px; flex-basis: 100% }
.whochip { display: inline-flex; align-items: center }
.whochip .x { border: 0; background: none; color: var(--muted); font: inherit; font-size: 15px; padding: 6px 8px; cursor: pointer; min-width: 32px }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; background: var(--accent); color: var(--on-accent); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line) }
.btn.wide { width: 100% }
.btn.plank { background: var(--plank); color: #1c1407 }
.btn:disabled { opacity: .45; cursor: default }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px }

/* bridge planks */
.bridge { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; align-items: end }
.bridge i { display: block; height: 14px; border-radius: 3px; background: var(--plank-empty) }
.bridge i.done { background: var(--plank) }
.bridge i.now { background: var(--plank-soft); outline: 2px solid var(--plank); outline-offset: -2px }
.bridge-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px }

.day h2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.day .range { font: 600 14px var(--f-body); color: var(--plank) }
.day .story { color: var(--muted); font-size: 14px; margin: 2px 0 14px }
.day .status { font-size: 14px; color: var(--muted); margin-top: 12px }
.day .status b { color: var(--ink) }
.day .acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap }
.day .acts .btn { flex: 1 1 140px }
.retrynote { margin: 8px 0 0 }
.restore summary { cursor: pointer; font-size: 14.5px; color: var(--muted); list-style: none }
.restore summary::-webkit-details-marker { display: none }
.restore summary b { color: var(--accent); text-decoration: underline; text-underline-offset: 3px }
.restore[open] summary { margin-bottom: 2px }
.lockcard { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 28px 18px }
.lockcard .lockicon { width: 48px; height: 48px; border-radius: 50%; background: var(--plank-soft); color: var(--plank); display: grid; place-items: center }
.lockcard .lockicon svg { width: 22px; height: 22px }
.lockcard h2 { word-break: keep-all; text-wrap: balance }
.lockcard .sub { word-break: keep-all; font-size: 14.5px; max-width: 34em }
.lockcard .btn { min-width: 180px }
.seglock { display: inline-flex; vertical-align: -1px; margin-right: 4px; color: var(--plank) }
.lknote { color: var(--bad) !important; font-weight: 600 }
.btn.locked { flex-direction: column; gap: 0; line-height: 1.25; color: var(--muted); background: var(--plank-empty); border-color: transparent; opacity: 1 }
.btn.locked span { display: inline-flex; align-items: center; gap: 5px }
.btn.locked svg { margin-top: -1px }
.btn.locked small { font-size: 11.5px; font-weight: 500 }
.steps-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding: 0; list-style: none }
.steps-list button { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); line-height: 1.4 }
.steps-list button:disabled { cursor: default; opacity: .75 }
.steps-list button.done { background: var(--plank-soft); color: var(--ink); border-color: transparent }
.steps-list button.next { border: 1.5px solid var(--plank); color: var(--ink); font-weight: 600 }
.steps-list small { color: var(--muted); font-variant-numeric: tabular-nums }

/* 완료 도장 · 달력 */
.stampcard { display: grid; gap: 14px }
.stamp-sum { font-size: 13.5px; color: var(--muted) }
.stamp-sum b { color: var(--stamp) }
.stamps { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 10px; justify-items: center }
.stamp { position: relative; width: 100%; max-width: 104px; aspect-ratio: 1; border-radius: 50%; display: grid; place-content: center; text-align: center; gap: 1px;
  border: 4px double var(--stamp); color: var(--stamp); background: var(--stamp-soft); transform: rotate(-9deg); line-height: 1.15 }
.stamp b { font: 400 22px/1.1 var(--f-display) }
.stamp small { font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums }
.stamp.pend { border-color: var(--plank); color: var(--plank); background: var(--plank-soft); transform: rotate(-4deg) }
.stamp.pend b { font-size: 16px }
.stamp.empty { border: 2px dashed var(--line); color: var(--muted); background: transparent; transform: none }
.stamp.empty b { font-size: 20px; opacity: .5 }
.stamp .times { position: absolute; top: -2px; right: -2px; font: 700 12px var(--f-body); font-style: normal; background: var(--stamp); color: #fff; border-radius: 999px; padding: 1px 7px; transform: rotate(9deg) }
.cal { border-top: 1px solid var(--line); padding-top: 10px }
.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px }
.cal-head .link { text-decoration: none; font-size: 22px; padding: 0 10px }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center }
.cal-w { font-size: 12px; color: var(--muted); padding: 2px 0 }
.cal-w.we, .cal-d.we { color: var(--stamp) }
.cal-d { position: relative; justify-self: center; width: 38px; height: 38px; border-radius: 50%; border: 0; background: none; font-size: 14.5px; font-variant-numeric: tabular-nums; padding: 0 }
.cal-d:disabled { cursor: default; opacity: 1; color: inherit }
.cal-d.we:disabled { color: var(--stamp) }
.cal-d.today { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 700 }
.cal-d.done { background: var(--accent); color: var(--on-accent); font-weight: 700 }
.cal-d.done.today { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent) }
.cal-d.done.sel { outline: 3px solid var(--plank); outline-offset: 1px }
.cal-d i { position: absolute; top: -3px; right: -3px; font: 700 10.5px/1 var(--f-body); font-style: normal; background: var(--stamp); color: #fff; border-radius: 999px; padding: 2px 5px }
.cal-legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px }
.cal-legend span { display: inline-flex; align-items: center; gap: 5px }
.lg { width: 11px; height: 11px; border-radius: 50%; display: inline-block }
.lg.today { box-shadow: inset 0 0 0 2px var(--accent) }
.lg.done { background: var(--accent) }
.cal-list { margin: 10px 0 0; padding: 10px 12px; list-style: none; background: var(--bg); border-radius: 10px; display: grid; gap: 4px; font-size: 14px }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--plank-empty); border-radius: 14px }
.tabs button { border: 0; background: transparent; border-radius: 10px; padding: 10px 4px; font-weight: 600; color: var(--muted); font-size: 15px }
.tabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow) }
.seg { display: flex; gap: 8px; flex-wrap: wrap }
.seg button { flex: 1 1 120px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 12px; font-weight: 600 }
.seg button small { font-weight: 500; color: var(--plank) }
.seg button.on { border-color: var(--accent); background: var(--accent-soft) }
.typegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
.typebtn { display: grid; gap: 2px; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px }
.typebtn:hover { border-color: var(--accent) }
.typebtn small { color: var(--muted); font-size: 13px }

/* insert / odd */
.given { display: grid; gap: 4px; border: 1.5px solid var(--plank); background: var(--plank-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: 17.5px; line-height: 1.55 }
.para { line-height: 2 }
.src { display: inline-flex; margin: -4px 0 10px; padding: 4px 12px; border-radius: 999px; background: var(--plank-soft); color: var(--ink); border: 1.5px solid var(--plank); font-size: 14px }
.src b { font-weight: 700 }
.exam-box { display: block; margin-top: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 15.5px; line-height: 1.7; max-height: 46vh; overflow-y: auto; font-weight: 400 }
.exam-box p { margin: 0 0 4px }
.mark.gap { padding: 0 8px; font-weight: 700; color: var(--accent) }
.sent { display: inline; border: 0; background: none; padding: 2px 3px; border-radius: 6px; font: inherit; line-height: inherit; text-align: left; color: inherit; -webkit-box-decoration-break: clone; box-decoration-break: clone }
.sent:hover:not(:disabled) { background: var(--accent-soft) }
.sent sup { color: var(--accent); font-weight: 700; font-size: .7em; margin-right: 2px }
.sent.right { background: var(--ok-soft); outline: 2px solid var(--ok) }
.sent.wrong { background: var(--bad-soft); outline: 2px solid var(--bad) }
.inserted { background: var(--ok-soft); border-radius: 6px; padding: 1px 4px; color: var(--ok); font-weight: 600 }

/* run */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 12px; display: grid; gap: 8px }
.topbar .row { justify-content: space-between }
.crumb { font-size: 14px; color: var(--muted) }
.crumb b { color: var(--ink); font-weight: 600 }
.stepname { font: 400 26px/1.2 var(--f-display); margin: 8px 0 2px }
.guide { color: var(--muted); font-size: 14.5px; margin: 0 0 14px }
.qno { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 8px }
.prompt { font-size: 19px; line-height: 1.65; overflow-wrap: anywhere }
.prompt.big { font-size: 26px; font-weight: 600 }
.prompt .ko { display: block; font-size: 15px; color: var(--muted); margin-bottom: 6px }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2.5px solid var(--accent); padding: 0 4px; text-align: center; color: var(--accent); font-weight: 600 }
.blank.ok { border-color: var(--ok); color: var(--ok) }
.verbhint { color: var(--plank); font-weight: 600 }
.opts { display: grid; gap: 8px; margin-top: 16px }
.opts.two { grid-template-columns: 1fr 1fr }
.opt { text-align: left; padding: 13px 15px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16.5px; line-height: 1.45; min-height: 50px; overflow-wrap: anywhere }
.opts.two .opt { text-align: center; font-weight: 600 }
.opt:hover:not(:disabled) { border-color: var(--accent) }
.opt:disabled { cursor: default }
.opt.right { border-color: var(--ok); background: var(--ok-soft) }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft) }
.tfbtn { font: 400 30px var(--f-display); padding: 14px }
.mark { border: 0; background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 1px 6px; margin: 0 1px; font: inherit; line-height: 1.5 }
.mark sup { color: var(--accent); font-weight: 700; font-size: .7em; margin-right: 2px }
.mark.right { background: var(--ok-soft); outline: 2px solid var(--ok) }
.mark.wrong { background: var(--bad-soft); outline: 2px solid var(--bad) }
.fix { color: var(--ok); font-weight: 700 }
.typein { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap }
.typein input { flex: 1 1 180px; min-width: 0; font: 500 18px var(--f-body); padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink) }
.typein input.right { border-color: var(--ok); background: var(--ok-soft) }
.typein input.wrong { border-color: var(--bad); background: var(--bad-soft) }

.tray { min-height: 58px; border: 2px dashed var(--line); border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; margin-top: 14px }
.tray.lines { display: grid }
.tray.right { border-style: solid; border-color: var(--ok) }
.tray.wrong { border-style: solid; border-color: var(--bad) }
.pool { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px }
.pool.lines { display: grid }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 16.5px; line-height: 1.35; text-align: left; overflow-wrap: anywhere }
.chip.used { visibility: hidden }
.chip.in { background: var(--accent-soft); border-color: transparent }
.chip .n { display: inline-block; min-width: 1.4em; font-weight: 700; color: var(--accent) }
.punct { align-self: flex-end; font-size: 20px; color: var(--muted); padding: 0 4px }

.feedback { margin-top: 16px; border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.55 }
.feedback.ok { background: var(--ok-soft) }
.feedback.bad { background: var(--bad-soft) }
.feedback b.tag { display: block; font-size: 16px; margin-bottom: 2px }
.feedback.ok b.tag { color: var(--ok) }
.feedback.bad b.tag { color: var(--bad) }
.ev { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px }
.ev-h { font-size: 12.5px; font-weight: 700; color: var(--plank); letter-spacing: .03em }
.ev-l { display: grid; gap: 1px }
.ev-l .en { font-size: 15px; line-height: 1.5 }
.ev-l .en b { background: var(--plank-soft); border-radius: 3px; padding: 0 2px; font-weight: 600 }
.ev-l .ko { font-size: 14px; color: var(--muted); line-height: 1.5 }
.per-i { display: grid; gap: 3px; padding-top: 8px; border-top: 1px solid var(--line) }
.per-i:first-of-type { border-top: 0; padding-top: 0 }
.per-o { font-size: 15px; line-height: 1.45 }
.per-o b { color: var(--bad); margin-right: 2px }
.per-i.ans .per-o b { color: var(--ok) }
.per-ko { font-size: 14px; color: var(--muted) }
.per-note { font-size: 14px; font-weight: 600 }
.per-ev { display: grid; gap: 4px; margin-top: 2px; padding-left: 10px; border-left: 3px solid var(--plank-soft) }
.ev-tag { font-size: 11.5px; font-weight: 700; color: var(--muted) }
.flow { margin: 0; padding-left: 1.4em; display: grid; gap: 3px; font-size: 14.5px; line-height: 1.5 }
.flow li::marker { color: var(--plank); font-weight: 700 }
.flow li.on { font-weight: 700; background: var(--plank-soft); border-radius: 6px; padding: 0 6px; margin-left: -6px }
.flow li small { font-weight: 600; color: var(--plank) }
.answer-line { margin-top: 10px; font-size: 15px; overflow-wrap: anywhere; white-space: pre-line }
.nextbar { margin-top: 16px; display: flex; gap: 8px }
.nextbar .btn { flex: 1 }

/* study list */
.wordlist { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); border-top: 1px solid var(--line); margin-top: 6px }
.wordlist div { padding: 9px 4px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere }
.wordlist .w { font-weight: 600 }
.wordlist .m { color: var(--muted) }

/* summary & result */
.score { font: 400 56px/1 var(--f-display); font-variant-numeric: tabular-nums }
.score small { font-size: 22px; color: var(--muted) }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px }
.tbl td { padding: 9px 4px; border-bottom: 1px solid var(--line) }
.tbl td:last-child { text-align: right; font-weight: 600; white-space: nowrap }
.tbl tr.low td:last-child { color: var(--bad) }
.rcard { background: var(--surface); border: 2px solid var(--plank); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: var(--shadow) }
.rc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px }
.rc-name { font: 400 26px/1.15 var(--f-display) }
.rc-unit { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.45 }
.rc-unit b { color: var(--ink) }
.rc-score { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums }
.rc-score b { font: 400 52px/1 var(--f-display) }
.rc-score span { font-size: 18px; color: var(--muted) }
.rc-score small { display: block; font-size: 13px; color: var(--muted) }
.rc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px }
.rc-grid div { background: var(--bg); border-radius: 10px; padding: 6px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 4px; font-size: 13px; min-width: 0 }
.rc-grid span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.rc-grid b { font-variant-numeric: tabular-nums; white-space: nowrap }
.rc-grid div.low { background: var(--bad-soft) }
.rc-grid div.low b { color: var(--bad) }
