<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>데일리 영어</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<style>
:root { --bg: #f3f6f1; --ink: #1c2822; --muted: #5b6a61; --plank: #c98a1b; --plank-empty: #e6ebe4 }
@media (prefers-color-scheme: dark) { :root { --bg: #111613; --ink: #e6ede8; --muted: #9aa8a0; --plank: #e0a645; --plank-empty: #28302b; color-scheme: dark } }
html, body { background: var(--bg); color: var(--ink); margin: 0; font: 16px/1.6 "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif }
main { min-height: 100vh; display: grid; place-content: center; gap: 10px; text-align: center; padding: 24px }
.planks { display: flex; gap: 4px; justify-content: center } .planks i { width: 24px; height: 7px; border-radius: 2px; background: var(--plank-empty) } .planks i:nth-child(-n+2) { background: var(--plank) }
p { margin: 0; color: var(--muted) }
</style>
</head>
<body>
<main><div class="planks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><b>데일리 영어</b><p>선생님께 받은 학습 링크로 들어와 주세요.</p></main>
</body>
</html>
