<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>중산중 1학년 시험 범위</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<style>
:root { --bg: #f3f6f1; --card: #fff; --ink: #1c2822; --muted: #5b6a61; --line: #dfe5dc; --accent: #2f6b4f; --plank: #c98a1b; --plank-empty: #e6ebe4 }
@media (prefers-color-scheme: dark) { :root { --bg: #111613; --card: #1a211d; --ink: #e6ede8; --muted: #9aa8a0; --line: #2b342e; --accent: #7cc19c; --plank: #e0a645; --plank-empty: #28302b; color-scheme: dark } }
* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink); margin: 0; font: 16px/1.55 "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif }
main { max-width: 520px; margin: 0 auto; padding: 28px 16px 40px }
.top { text-align: center; margin-bottom: 22px }
.planks { display: flex; gap: 4px; justify-content: center; margin-bottom: 10px } .planks i { width: 24px; height: 7px; border-radius: 2px; background: var(--plank-empty) } .planks i:nth-child(-n+2) { background: var(--plank) }
h1 { font-size: 22px; margin: 0 } .top p { margin: 4px 0 0; color: var(--muted); font-size: 14px }
.who { margin-top: 8px; font-size: 14px; color: var(--accent); font-weight: 700 }
a.unit { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px; margin-bottom: 14px; color: inherit; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,.04) }
a.unit:active { transform: scale(.99) }
.tag { display: inline-block; font-size: 12px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 10px }
.tag.mock { background: var(--plank) }
.name { font-size: 19px; font-weight: 800; margin: 8px 0 2px }
.sub { color: var(--muted); font-size: 14px }
.row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 10px }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--plank-empty); overflow: hidden } .bar b { display: block; height: 100%; background: var(--accent); width: 0 }
.cnt { font-size: 13px; color: var(--muted); white-space: nowrap }
.go { font-weight: 800; color: var(--accent); white-space: nowrap }
.foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px }
</style>
</head>
<body>
<main>
  <div class="top"><div class="planks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <h1>중산중 1학년 시험 범위</h1><p>공부할 것을 골라 들어가세요</p><div class="who" id="who"></div></div>
  <div id="list"></div>
  <p class="foot">이름은 한 번만 입력하면 두 곳 모두에서 이어져요.</p>
</main>
<script>
/* 11/10 중산중 1: 동아(윤정미) 본문 + 공통 문법을 한 주소에서. 진도는 각 앱이 이 기기에 저장한 기록(daily:<id>:<이름>)을 읽어 보여 줌 */
var UNITS = [
  { tag: '본문', cls: '', name: '동아(윤정미) Lesson 5~7', sub: 'Zero-Waste Challenge · Let’s Make a Movie! · Who Threw a Cake at the Monalisa?', id: 'm1-donga-yoon-L6', days: ['c6a','c6b','d1','d2','c7a','c7b','d3','d4','c5a','c5b','L5a','L5b'], href: '../m1-donga-yoon-L6-my3ip/' },
  { tag: '문법', cls: 'mock', name: '공통 문법', sub: 'to부정사 ① 명사적 용법 · 접속사 that', id: 'm1-grammar-to1', days: ['t1','t2','t3','t4','t5','t6','t7','t8','t9','t10','t11','t12','c1','c2','c3','c4','c5','c6','c7','c8'], href: '../m1-grammar-to1-1nn76/' }
];
function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var who = get('daily:who') || '';
if (who) document.getElementById('who').textContent = who + ' 학생';
document.getElementById('list').innerHTML = UNITS.map(function (u) {
  var done = 0;
  if (who) { try { var S = JSON.parse(get('daily:' + u.id + ':' + who)) || {}; u.days.forEach(function (d) { if (S.days && S.days[d] && S.days[d].finished) done++; }); } catch (e) {} }
  var pct = Math.round(done / u.days.length * 100);
  return '<a class="unit" href="' + u.href + '"><span class="tag ' + u.cls + '">' + u.tag + '</span><div class="name">' + esc(u.name) + '</div><div class="sub">' + esc(u.sub) + '</div>' +
    '<div class="row"><div class="bar"><b style="width:' + pct + '%"></b></div><span class="cnt">DAY ' + done + ' / ' + u.days.length + ' 완료</span><span class="go">들어가기 →</span></div></a>';
}).join('');
</script>
</body>
</html>
