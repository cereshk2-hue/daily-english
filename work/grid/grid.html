<!doctype html><html><head><base target="_top"><meta charset="utf-8">
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap");
:root{--bg:#f5f6fa;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e6e9f0;--blue:#2643c4;--soft:#eef1fd;--navy:#101a3a;--ok:#12805c;--oks:#dff3e8;--warn:#b26a00;--warns:#ffefcc;--bad:#d1435b;--bads:#fdecef;--prog:#dbe4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--navy);color:#fff;padding:16px 16px 12px;position:relative}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}.sub{font-size:12px;color:#aab6d8;margin-top:2px}
.back{position:absolute;top:16px;right:16px;background:#fff;color:var(--navy);text-decoration:none;font-weight:800;font-size:13px;border-radius:99px;padding:7px 14px}
.bar{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.bar button{flex:none;border:0;border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;background:rgba(255,255,255,.1);color:#c9d3ee;text-align:left;line-height:1.25}
.bar button small{display:block;font-size:11px;font-weight:500;opacity:.8}.bar button.on{background:#fff;color:var(--navy)}
.ctl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ctl input{flex:1 1 160px;border:0;border-radius:10px;padding:9px 12px;font:inherit;background:rgba(255,255,255,.12);color:#fff}.ctl input::placeholder{color:#aab6d8}
.ctl select{border:0;border-radius:10px;padding:9px 10px;font:inherit;font-weight:700;background:rgba(255,255,255,.12);color:#fff}.ctl select option{color:#000}
main{padding:12px}
.unit{background:var(--card);border-radius:16px;padding:14px 0 6px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06)}
.uh{padding:0 14px 10px}.uh b{font-size:16px}.uh .m{color:var(--muted);font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}.legend span{display:inline-flex;align-items:center;gap:4px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px}
.wrap{overflow:auto;max-height:calc(100vh - 230px);border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
thead th{position:sticky;top:0;background:#fff;z-index:2;font-weight:700;color:var(--muted);height:34px;min-width:38px;padding:0 4px;cursor:pointer}
thead th.on{background:var(--soft);color:var(--blue)}
thead th.grp{border-left:2px solid var(--navy)}
th.nm,td.nm{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:6px 10px;min-width:118px;max-width:150px}
thead th.nm{z-index:3}
td.nm b{display:block;font-size:13.5px}td.nm small{color:var(--muted);font-size:11px}td.nm small.old{color:var(--bad);font-weight:700}td.nm small.today{color:var(--ok);font-weight:700}
td.c{height:38px;min-width:38px;font-weight:800;font-size:12px}
td.c.done{background:var(--oks);color:var(--ok)}td.c.low{background:#fde3e6;color:var(--bad)}td.c.rev{background:var(--warns);color:var(--warn)}td.c.prog{background:var(--prog);color:var(--blue);font-size:11px}
td.c.done i,td.c.low i,td.c.rev i{display:block;font-style:normal;font-size:10.5px;font-weight:600;opacity:.85;line-height:1}
td.c.grp,thead th.grp{border-left:2px solid var(--navy)}
td.c.cur{outline:2px solid var(--blue);outline-offset:-2px}
.tip{position:sticky;left:0;padding:8px 14px;font-size:12.5px;color:var(--ink);background:var(--soft);min-height:34px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.err{margin:12px 0;background:var(--warns);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:12.5px}
</style></head><body>
<header><h1>학생별 진도표</h1><a class="back" id="back">← 현황판</a><div class="sub" id="made"></div>
<div class="bar" id="bar"></div>
<div class="ctl"><input id="q" placeholder="학생 이름 찾기"><select id="sort"><option value="prog">진도 많은 순</option><option value="name">이름순</option><option value="last">최근 학습 순</option></select></div></header>
<main><div id="out"></div></main>
<script>
var D=<?!= data ?>,BACK=<?!= back ?>,BOARD=<?!= board ?>;
document.getElementById("back").href=BACK;
function E(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function dk(t){var d=new Date(t);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function md(t){if(!t)return"";var d=new Date(t);return(d.getMonth()+1)+"/"+d.getDate()}
function nz(s){return String(s||"").replace(/\s+/g,"").replace(/변형어휘/g,"실전어휘뚫기")}
var U={},CUR=null,COL=-1,Q="",SORT="prog",UNITS=null,ERR="";
/* 현황 줄 → 단원별로 모으기 */
D.rows.forEach(function(r){var k=nz(r[2]);var u=U[k]||(U[k]={key:k,name:r[2],book:r[1],rows:[],last:0,students:{}});u.rows.push(r);if(r[7]>u.last)u.last=r[7];u.students[r[0]]=1});
function cols(u){
  var days=[],tests=[],seen={};
  var meta=UNITS&&UNITS[u.key];
  if(meta)meta.days.forEach(function(d){days.push({name:d.name,range:d.range,k:[nz(d.range),nz(d.name)]})});
  u.rows.forEach(function(r){var day=String(r[3]);
    if(/^Wrap-up/.test(day)){if(!seen[day]){seen[day]=1;tests.push({name:day.replace(/^Wrap-up\s*/,""),range:r[4],k:[nz(day)],test:1})}return}
    if(!meta){var key=nz(r[4])||nz(day);if(!seen[key]){seen[key]=1;days.push({name:day,range:r[4],k:[nz(r[4]),nz(day)]})}}});
  if(!meta)days.sort(function(a,b){return(parseInt(a.name.replace(/\D/g,""))||0)-(parseInt(b.name.replace(/\D/g,""))||0)});
  return days.concat(tests);
}
function cellOf(u,name,c){
  var best=null;u.rows.forEach(function(r){if(r[0]!==name)return;var hit=c.test?nz(r[3])===c.k[0]:(nz(r[4])&&nz(r[4])===c.k[0])||(!nz(r[4])&&nz(r[3])===c.k[1]);if(hit&&(!best||r[7]>best[7]))best=r});
  return best;
}
function bar(){
  var L=Object.keys(U).map(function(k){return U[k]}).sort(function(a,b){return b.last-a.last});
  if(!CUR&&L.length)CUR=L[0].key;
  document.getElementById("bar").innerHTML=L.map(function(u){return'<button data-u="'+E(u.key)+'" class="'+(u.key===CUR?"on":"")+'">'+E(u.book)+'<small>'+E(u.name.length>34?u.name.slice(0,33)+"…":u.name)+' · '+Object.keys(u.students).length+'명</small></button>'}).join("");
  [].forEach.call(document.querySelectorAll("[data-u]"),function(b){b.onclick=function(){CUR=b.dataset.u;COL=-1;bar();draw()}});
}
function draw(){
  var u=U[CUR],o=document.getElementById("out");
  if(!u){o.innerHTML='<div class="empty">아직 기록이 없어요.</div>';return}
  var C=cols(u),nd=C.filter(function(c){return!c.test}).length;
  var names=Object.keys(u.students).filter(function(n){return!Q||n.indexOf(Q)>=0});
  var info={};names.forEach(function(n){var done=0,last=0,far=-1;C.forEach(function(c,i){var r=cellOf(u,n,c);if(!r)return;if(!c.test&&(r[5]==="완료"||r[5]==="오답 학습 남음")){done++;far=Math.max(far,i)}if(r[7]>last)last=r[7]});info[n]={done:done,last:last,far:far}});
  names.sort(function(a,b){if(SORT==="name")return a.localeCompare(b,"ko");if(SORT==="last")return info[b].last-info[a].last;return info[b].done-info[a].done||info[b].far-info[a].far||a.localeCompare(b,"ko")});
  var h='<div class="unit"><div class="uh"><b>'+E(u.book)+'</b> <span class="m">'+E(u.name)+'</span>'+
    '<div class="legend"><span><i class="sw" style="background:var(--oks)"></i>완료(점수)</span><span><i class="sw" style="background:#fde3e6"></i>완료 · 70점 미만</span><span><i class="sw" style="background:var(--warns)"></i>오답 학습 남음</span><span><i class="sw" style="background:var(--prog)"></i>하는 중(단계)</span><span><i class="sw" style="background:#fff;border:1px solid var(--line)"></i>시작 전</span></div></div>';
  h+='<div class="tip" id="tip">'+(COL>=0&&C[COL]?E((C[COL].test?"시험 · ":C[COL].name+" · ")+(C[COL].test?C[COL].name:C[COL].range)):"숫자(DAY)를 누르면 범위가 보여요. 굵은 세로줄 오른쪽은 OMR 시험이에요.")+'</div>';
  h+='<div class="wrap"><table><thead><tr><th class="nm">학생 · 완료 DAY</th>'+C.map(function(c,i){var lab=c.test?(c.name.length>8?c.name.slice(0,7)+"…":c.name):c.name.replace(/^DAY\s*/,"");var first=c.test&&(i===0||!C[i-1].test);return'<th data-c="'+i+'" class="'+(i===COL?"on ":"")+(first?"grp":"")+'" title="'+E(c.name+" · "+(c.range||""))+'">'+E(lab)+'</th>'}).join("")+'</tr></thead><tbody>';
  h+=names.map(function(n){var f=info[n],cls=dk(f.last)===D.today?"today":(Date.now()-f.last)/864e5>3?"old":"";
    return'<tr><td class="nm"><b>'+E(n)+'</b><small class="'+cls+'">'+f.done+' / '+nd+' DAY · '+(cls==="today"?"오늘":md(f.last))+'</small></td>'+C.map(function(c,i){var r=cellOf(u,n,c),first=c.test&&(i===0||!C[i-1].test),cc="c"+(first?" grp":"")+(i===COL?" cur":"");
      if(!r)return'<td class="'+cc+'"></td>';
      var p=r[5],sc=String(r[6]||""),num=parseInt(sc,10);
      if(p==="완료"){var low=!isNaN(num)&&num<70;return'<td class="'+cc+(low?" low":" done")+'" title="'+E(c.name+" 완료 "+sc+" · "+md(r[8]||r[7]))+'">✓<i>'+E(isNaN(num)?"":num)+'</i></td>'}
      if(p==="오답 학습 남음")return'<td class="'+cc+' rev" title="'+E(c.name+" 오답 학습 남음 "+sc)+'">!<i>'+E(isNaN(num)?"":num)+'</i></td>';
      var m=/(\d+)\/(\d+)/.exec(p);return'<td class="'+cc+' prog" title="'+E(c.name+" "+p)+'">'+E(m?m[1]+"/"+m[2]:"…")+'</td>'}).join("")+'</tr>'}).join("");
  h+='</tbody></table></div></div>';
  if(ERR)h='<div class="err">'+E(ERR)+'</div>'+h;
  o.innerHTML=h;
  [].forEach.call(o.querySelectorAll("[data-c]"),function(t){t.onclick=function(){COL=+t.dataset.c===COL?-1:+t.dataset.c;draw()}});
}
document.getElementById("made").textContent=new Date(D.made).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+" 기준 · 새로고침하면 최신으로 바뀌어요";
document.getElementById("q").oninput=function(){Q=this.value.trim();draw()};
document.getElementById("sort").onchange=function(){SORT=this.value;draw()};
bar();draw();
/* 단원별 전체 DAY 목록은 선생님 보드에서 가져온다 (못 가져오면 학생 기록에 나온 DAY만 표시) */
fetch(BOARD,{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
  var m=/window\.UNITS\s*=\s*(\[[\s\S]*?\]);/.exec(t);if(!m)throw 0;UNITS={};
  JSON.parse(m[1]).forEach(function(x){UNITS[nz(x.unit+" "+x.title)]=x});draw();
}).catch(function(){ERR="보드에서 전체 DAY 목록을 못 가져와서, 학생이 한 번이라도 연 DAY만 보여요.";draw()});
</script></body></html>
