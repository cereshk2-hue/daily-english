<!doctype html><html><head><base target="_top"><meta charset="utf-8">
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap");
:root{--bg:#f5f6fa;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e6e9f0;--blue:#2643c4;--soft:#eef1fd;--navy:#101a3a;--ok:#12805c;--oks:#dff3e8;--warn:#b26a00;--warns:#ffefcc;--bad:#d1435b;--bads:#fdecef;--prog:#dbe4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--navy);color:#fff;padding:16px 16px 12px;position:relative}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}.sub{font-size:12px;color:#aab6d8;margin-top:2px}
.back{position:absolute;top:16px;right:16px;background:#fff;color:var(--navy);text-decoration:none;font-weight:800;font-size:13px;border-radius:99px;padding:7px 14px}
.bar{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.bar button{flex:none;border:0;border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;background:rgba(255,255,255,.1);color:#c9d3ee;text-align:left;line-height:1.25}
.bar button small{display:block;font-size:11px;font-weight:500;opacity:.8}.bar button.on{background:#fff;color:var(--navy)}
.ctl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ctl input{flex:1 1 160px;border:0;border-radius:10px;padding:9px 12px;font:inherit;background:rgba(255,255,255,.12);color:#fff}.ctl input::placeholder{color:#aab6d8}
.ctl select{border:0;border-radius:10px;padding:9px 10px;font:inherit;font-weight:700;background:rgba(255,255,255,.12);color:#fff}.ctl select option{color:#000}
main{padding:12px}
.unit{background:var(--card);border-radius:16px;padding:14px 0 6px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06)}
.uh{padding:0 14px 10px}.uh b{font-size:16px}.uh .m{color:var(--muted);font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}.legend span{display:inline-flex;align-items:center;gap:4px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px}
.wrap{overflow:auto;max-height:calc(100vh - 230px);border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
thead th{position:sticky;top:0;background:#fff;z-index:2;font-weight:800;color:var(--ink);height:48px;min-width:52px;max-width:64px;padding:4px 3px;cursor:pointer;vertical-align:top;white-space:normal;line-height:1.15}
thead th .sl{display:block;font-size:9.5px;font-weight:500;color:var(--muted);margin-top:2px;word-break:keep-all;overflow-wrap:anywhere}thead th .tn{font-size:10.5px;color:var(--navy);white-space:nowrap;letter-spacing:-.02em}
thead th.on{background:var(--soft);color:var(--blue)}
thead th.grp{border-left:2px solid var(--navy)}
th.nm,td.nm{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:6px 10px;min-width:118px;max-width:150px}
thead th.nm{z-index:3}
td.nm b{display:block;font-size:13.5px}td.nm small{color:var(--muted);font-size:11px}td.nm small.old{color:var(--bad);font-weight:700}td.nm small.today{color:var(--ok);font-weight:700}
td.c{height:38px;min-width:52px;font-weight:800;font-size:12px}
td.c.done{background:var(--oks);color:var(--ok)}td.c.low{background:#fde3e6;color:var(--bad)}td.c.rev{background:var(--warns);color:var(--warn)}td.c.prog{background:var(--prog);color:var(--blue);font-size:11px}
td.c.done i,td.c.low i,td.c.rev i{display:block;font-style:normal;font-size:10.5px;font-weight:600;opacity:.85;line-height:1}
td.c.grp,thead th.grp{border-left:2px solid var(--navy)}
td.c.cur{outline:2px solid var(--blue);outline-offset:-2px}
thead th.old{color:#94a3b8;font-weight:500}td.c.oldc{opacity:.75}
.tip{position:sticky;left:0;padding:8px 14px;font-size:12.5px;color:var(--ink);background:var(--soft);min-height:34px}
.gbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px;scrollbar-width:none}.gbar button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;font-weight:700;color:var(--muted)}.gbar button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.gbar button small{font-weight:500;margin-left:3px;opacity:.75}
.bar2{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.bar2 button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 11px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);text-align:left;line-height:1.25;max-width:100%}.bar2 button small{display:block;font-size:11px;font-weight:500;color:var(--muted)}.bar2 button.on{background:var(--blue);color:#fff;border-color:var(--blue)}.bar2 button.on small{color:#dbe4ff}.bar2 button mark{background:#fff3b0;color:inherit;border-radius:3px;padding:0 2px}.bar2 button .sc{display:inline-block;font-size:11px;font-weight:800;background:var(--soft);color:var(--blue);border-radius:6px;padding:1px 6px;margin-right:2px}.bar2 button.on .sc{background:#fff}.bar2 button.on mark{background:#fff;color:var(--blue)}
#hint{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.err{margin:12px 0;background:var(--warns);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:12.5px}
</style></head><body>
<header><h1>학생별 진도표</h1><a class="back" id="back">← 현황판</a><div class="sub" id="made"></div>
<div class="ctl"><input id="q" placeholder="학생 이름 · 학교 · 학년 · 교재로 찾기 (예: 김민지, 중산중1, 중1, 지학사)"><select id="sort"><option value="prog">진도 많은 순</option><option value="name">이름순</option><option value="last">최근 학습 순</option></select></div></header>
<main><div class="gbar" id="gbar"></div><div class="bar2" id="bar"></div><div id="hint"></div><div id="out"></div></main>
<script>
var D=<?!= data ?>,BACK=<?!= back ?>,BOARD=<?!= board ?>;
document.getElementById("back").href=BACK;
function E(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function dk(t){var d=new Date(t);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function md(t){if(!t)return"";var d=new Date(t);return(d.getMonth()+1)+"/"+d.getDate()}
function nz(s){return String(s||"").replace(/\s+/g,"").replace(/변형어휘/g,"실전어휘뚫기")}
var U={},CUR=null,COL=-1,Q="",SORT="prog",MAP=null,ERR="",READY=false;
function pidOf(r){return MAP&&MAP.uk[nz(r[2])]||("raw:"+nz(r[2]))}
/* 기록 한 줄의 DAY 문자열("DAY 6 32번", "Wrap-up 끝판왕 20·21번 중산고1") → 지금 단원의 칸 */
function colOf(u,r){var ds=String(r[3]),z=nz(ds);
  if(u.meta){
    if(/^Wrap-up/.test(ds)){var ttl=ds.indexOf("¦")>=0?nz(ds.split("¦")[1]):"";if(ttl)for(var j=0;j<u.meta.tests.length;j++){if(nz(u.meta.tests[j][2])===ttl)return"t:"+u.meta.tests[j][0]}for(var i=0;i<u.meta.tests.length;i++){var t=u.meta.tests[i];if(t[1]&&z.indexOf(nz("Wrap-up "+t[1]))===0)return"t:"+t[0]}}
    else{var rg=nz(ds.replace(/^DAY\s*\d+\s*/,"")),hit=null,nm=nz((/^DAY\s*\d+/.exec(ds)||[""])[0]);
      u.meta.days.forEach(function(d){if(nz(d[2])===rg&&(!hit||nz(d[1])===nm))hit=d});if(hit)return"d:"+hit[0]}
  }
  return"x:"+z;
}
function merge(o,r){if(!o)return r.slice();var m=o.slice(),oF=!!o[7],rF=!!r[7];
  if(rF&&(!m[7]||r[7]<m[7])){m[7]=r[7];m[5]=r[5]}
  if((rF&&(!oF||r[6]>o[6]))||(!oF&&!rF&&r[6]>o[6]))m[4]=r[4];
  m[6]=Math.max(o[6],r[6]);return m}
function build(){
  U={};
  D.rows.forEach(function(r){var pid=pidOf(r),meta=MAP&&MAP.units[pid];
    var u=U[pid]||(U[pid]={key:pid,meta:meta,book:meta?meta.book:r[1],name:meta?meta.unit+" "+meta.title:r[2],cells:{},extra:{},last:0,students:{}});
    var c=colOf(u,r);if(c.indexOf("t:")===0&&meta){var tm=meta.tests.filter(function(x){return"t:"+x[0]===c})[0];if(tm&&tm[5]&&r[6]<tm[5])return}/* 11/18 리셋한 시험: 리셋 전 제출은 빼기 */
    if(c.indexOf("x:")===0&&!u.extra[c])u.extra[c]={key:c,name:String(r[3]).replace(/\s*¦.*$/,"").replace(/\s+/g," "),old:1};
    var S=u.cells[r[0]]||(u.cells[r[0]]={});S[c]=merge(S[c],r);
    if(r[6]>u.last)u.last=r[6];u.students[r[0]]=1});
}
function kindOf(c){if(c.kind)return c.kind;var t=String(c.range||"")+" "+String(c.name||"");return/끝판왕/.test(t)?"끝판왕":/비밀노트/.test(t)?"비밀노트":/Wrap-?up/i.test(t)?"Wrap-up":/변형기출/.test(t)?"변형기출":/마무리/.test(t)?"기출마무리":/실전 변형/.test(t)?"실전변형":/문법/.test(t)?"문법":"실전"}
function short(c){if(c.lab!=null)return c.lab;var r=String(c.test?c.name:c.range||"");
  r=r.replace(/^실전 어휘 뚫기\s*\d+\s*·\s*/,"어휘 ").replace(/^내용 꿰뚫기\s*\d*\s*·\s*/,"꿰뚫기 ").replace(/^YBM\s*/,"YBM").replace(/\s*·\s*/g," ").replace(/번/g,"").replace(/Lesson\s*/g,"L").replace(/본문\s*/,"본문");
  r=r.replace(/^(끝판왕|비밀노트|Wrap-?up)\s*/i,"").replace(/^(너른터\s*)?(\d과)\s*(변형기출|실전 변형)\s*/,"$2 ").replace(/^(\d) (\d과)\s*기출\s*마무리\s*/,"$1·$2 ").replace(/\s+/g," ").trim();return r.length>12?r.slice(0,11)+"…":r}
function cols(u){var C=[];
  if(u.meta){u.meta.days.forEach(function(d){C.push({key:"d:"+d[0],name:d[1],range:d[2],lab:d[3]})});u.meta.tests.forEach(function(t){C.push({key:"t:"+t[0],name:t[1],range:t[2],test:1,kind:t[3],lab:t[4]})})}
  Object.keys(u.extra).forEach(function(k){C.push(u.extra[k])});
  if(!u.meta)C.sort(function(a,b){return(parseInt(a.name.replace(/\D/g,""))||0)-(parseInt(b.name.replace(/\D/g,""))||0)});
  return C;
}
var GR="all";
function gradeOf(u){var m=/^(중|고)\d/.exec(String(u.book||""));return m?m[0]:"기타"}
function unitHit(u,q){return nz(u.book+" "+u.name+" "+gradeOf(u)+" "+(u.meta&&u.meta.school||"")).toLowerCase().indexOf(nz(q).toLowerCase())>=0}
function nameHits(u,q){return Object.keys(u.students).filter(function(n){return n.indexOf(q)>=0})}
function visible(){var q=Q;return Object.keys(U).map(function(k){return U[k]}).filter(function(u){
  if(GR!=="all"&&gradeOf(u)!==GR)return false;if(!q)return true;return unitHit(u,q)||nameHits(u,q).length})
  .sort(function(a,b){return(b.meta?1:0)-(a.meta?1:0)||b.last-a.last})}
function bar(){
  var all=Object.keys(U).map(function(k){return U[k]}),gs={};all.forEach(function(u){gs[gradeOf(u)]=(gs[gradeOf(u)]||0)+1});
  var order=["중1","중2","중3","고1","고2","고3","기타"].filter(function(g){return gs[g]});
  document.getElementById("gbar").innerHTML='<button data-g="all" class="'+(GR==="all"?"on":"")+'">전체<small>'+all.length+'</small></button>'+order.map(function(g){return'<button data-g="'+g+'" class="'+(GR===g?"on":"")+'">'+g+'<small>'+gs[g]+'</small></button>'}).join("");
  [].forEach.call(document.querySelectorAll("[data-g]"),function(b){b.onclick=function(){GR=b.dataset.g;CUR=null;COL=-1;bar();draw()}});
  var L=visible();if(!CUR||!L.some(function(u){return u.key===CUR}))CUR=L.length?L[0].key:null;
  document.getElementById("bar").innerHTML=L.map(function(u){var hs=Q&&!unitHit(u,Q)?nameHits(u,Q):[];
    return'<button data-u="'+E(u.key)+'" class="'+(u.key===CUR?"on":"")+'">'+(u.meta&&u.meta.school?'<span class="sc">'+E(u.meta.school)+'</span> ':'')+E(u.book)+(u.meta?"":" (예전 단원)")+'<small>'+E(u.name.length>30?u.name.slice(0,29)+"…":u.name)+' · '+Object.keys(u.students).length+'명'+(hs.length?' · <mark>'+E(hs.join(", "))+'</mark>':'')+'</small></button>'}).join("");
  [].forEach.call(document.querySelectorAll("[data-u]"),function(b){b.onclick=function(){CUR=b.dataset.u;COL=-1;bar();draw()}});
  document.getElementById("hint").textContent=Q?(L.length?"‘"+Q+"’ 찾은 반 "+L.length+"개 · 반을 눌러 보세요":"‘"+Q+"’(으)로 찾은 반이나 학생이 없어요"):"";
}
function draw(){
  var u=U[CUR],o=document.getElementById("out");
  if(!READY){o.innerHTML='<div class="empty">불러오는 중…</div>';return}
  if(!u){o.innerHTML='<div class="empty">'+(Q?'찾는 반이나 학생이 없어요.':'아직 기록이 없어요.')+'</div>';return}
  var C=cols(u),nd=C.filter(function(c){return!c.test&&!c.old}).length;
  var byName=Q&&!unitHit(u,Q),names=Object.keys(u.students).filter(function(n){return!byName||n.indexOf(Q)>=0});
  var info={};names.forEach(function(n){var S=u.cells[n]||{},done=0,last=0,far=-1,tt=0;C.forEach(function(c,i){var r=S[c.key];if(!r)return;if(r[7]){if(c.test)tt++;else if(!c.old){done++;far=Math.max(far,i)}}if(r[6]>last)last=r[6]});info[n]={done:done,last:last,far:far,tt:tt}});
  names.sort(function(a,b){if(SORT==="name")return a.localeCompare(b,"ko");if(SORT==="last")return info[b].last-info[a].last;return info[b].done-info[a].done||info[b].far-info[a].far||a.localeCompare(b,"ko")});
  var h='<div class="unit"><div class="uh"><b>'+(u.meta&&u.meta.school?E(u.meta.school)+' · ':'')+E(u.book)+'</b> <span class="m">'+E(u.name)+'</span>'+
    '<div class="legend"><span><i class="sw" style="background:var(--oks)"></i>완료(첫 점수)</span><span><i class="sw" style="background:#fde3e6"></i>완료 · 70점 미만</span><span><i class="sw" style="background:var(--warns)"></i>오답 학습 남음</span><span><i class="sw" style="background:var(--prog)"></i>하는 중(단계)</span><span><i class="sw" style="background:#fff;border:1px solid var(--line)"></i>시작 전</span></div></div>';
  h+='<div class="tip" id="tip">'+(COL>=0&&C[COL]?E(C[COL].old?"예전 DAY(지금은 없거나 이름이 바뀐 DAY) · "+C[COL].name:C[COL].test?(C[COL].kind||"OMR 시험")+" · "+C[COL].range:C[COL].name+" · "+C[COL].range):"숫자(DAY)를 누르면 범위가 보여요. 굵은 세로줄 오른쪽은 OMR 시험(Wrap-up·끝판왕 등), 회색 칸은 예전 DAY 기록이에요.")+'</div>';
  h+='<div class="wrap"><table><thead><tr><th class="nm">학생 · 완료</th>'+C.map(function(c,i){var lab=c.old?"예전":c.test?(c.name.length>9?c.name.slice(0,8)+"…":c.name):c.name.replace(/^DAY\s*/,"");var first=(c.test&&(i===0||!C[i-1].test))||(c.old&&(i===0||!C[i-1].old));return'<th data-c="'+i+'" class="'+(i===COL?"on ":"")+(first?"grp ":"")+(c.old?"old":"")+'" title="'+E(c.name+" · "+(c.range||""))+'">'+(c.test?'<span class="tn">'+E(kindOf(c))+'</span>':E(lab))+'<span class="sl">'+E(c.old?c.name.replace(/^DAY\s*\d+\s*/,"").slice(0,12):short(c))+'</span></th>'}).join("")+'</tr></thead><tbody>';
  h+=names.map(function(n){var f=info[n],S=u.cells[n]||{},cls=dk(f.last)===D.today?"today":(Date.now()-f.last)/864e5>3?"old":"";
    return'<tr><td class="nm"><b>'+E(n)+'</b><small class="'+cls+'">DAY '+f.done+'/'+nd+(f.tt?' · 시험 '+f.tt:'')+' · '+(cls==="today"?"오늘":md(f.last))+'</small></td>'+C.map(function(c,i){var r=S[c.key],first=(c.test&&(i===0||!C[i-1].test))||(c.old&&(i===0||!C[i-1].old)),cc="c"+(first?" grp":"")+(i===COL?" cur":"")+(c.old?" oldc":"");
      if(!r)return'<td class="'+cc+'"></td>';
      var p=r[4],sc=String(r[5]||""),num=parseInt(sc,10),when=md(r[7]||r[6]);
      if(r[7]&&p!=="오답 학습 남음"){var low=!isNaN(num)&&num<70;return'<td class="'+cc+(low?" low":" done")+'" title="'+E(c.name+" 완료 "+sc+" · "+when)+'">✓<i>'+E(isNaN(num)?"":num)+'</i></td>'}
      if(r[7])return'<td class="'+cc+' rev" title="'+E(c.name+" 오답 학습 남음 "+sc+" · "+when)+'">!<i>'+E(isNaN(num)?"":num)+'</i></td>';
      var m=/(\d+)\/(\d+)/.exec(p);return'<td class="'+cc+' prog" title="'+E(c.name+" "+p+" · "+when)+'">'+E(m?m[1]+"/"+m[2]:"…")+'</td>'}).join("")+'</tr>'}).join("");
  h+='</tbody></table></div></div>';
  if(ERR)h='<div class="err">'+E(ERR)+'</div>'+h;
  o.innerHTML=h;
  [].forEach.call(o.querySelectorAll("[data-c]"),function(t){t.onclick=function(){COL=+t.dataset.c===COL?-1:+t.dataset.c;draw()}});
}
document.getElementById("made").textContent=new Date(D.made).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+" 기준 · 새로고침하면 최신으로 바뀌어요";
document.getElementById("q").oninput=function(){Q=this.value.trim();COL=-1;bar();draw()};
document.getElementById("sort").onchange=function(){SORT=this.value;draw()};
function go(){READY=true;build();bar();draw()}
draw();
/* 단원 지도(예전 단원 이름 → 지금 단원, 전체 DAY·시험 목록)는 선생님 보드 폴더의 progress-map.json */
fetch(BOARD+"progress-map.json?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(m){MAP=m;go()})
  .catch(function(){ERR="단원 목록을 못 가져와서 학생 기록에 나온 이름 그대로 보여 드려요.";go()});
</script></body></html>
