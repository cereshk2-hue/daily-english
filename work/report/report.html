<style>

:root{--ink:#1f2a37;--sub:#6b7280;--line:#e7e2d8;--bg:#f6f2ea;--card:#fffdf9;--accent:#2f6b5a;--accent2:#e9f2ee;--warn:#c2410c;--warnbg:#fdeee4;--gold:#b7791f;--navy:#101a3a}
*{box-sizing:border-box}body{margin:0;background:#eceae4;color:var(--ink);font:15px/1.5 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--navy);color:#fff;padding:14px 16px 12px}

.wk{display:flex;align-items:center;gap:8px;margin-top:10px}
.wk a{color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border-radius:10px;padding:6px 12px;font-weight:700}
.wk b{font-size:15px;flex:1;text-align:center}.wk a{flex:none;white-space:nowrap}
.rg{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.rg input[type=date]{border:0;border-radius:10px;padding:6px 8px;font:inherit;font-size:14px;background:#fff;color:var(--navy);min-width:0;flex:1 1 130px;max-width:170px}
.rg span{color:#c9d3ee}
.rg button,.rg a{border:0;border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;font-weight:800;background:#fff;color:var(--navy);text-decoration:none;cursor:pointer}
.rg a{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.find{margin-top:10px;width:100%;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;background:rgba(255,255,255,.95);color:var(--navy)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .h{text-align:center;font-size:11.5px;color:var(--sub);font-weight:700}

.cal .c.on{background:var(--accent);color:#fff;font-weight:800}.cal .c.x{background:transparent}

.ppl button{flex:none;border:0;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;background:rgba(255,255,255,.1);color:#c9d3ee}

.tools{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}

.tools textarea{min-height:76px;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.btns button.l{background:#efece6;color:var(--ink)}
.msg{font-size:12.5px;color:var(--sub);margin-top:6px;min-height:18px}

.rc{background:var(--bg);padding:20px;border-radius:18px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.brand{font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:700}

.who{text-align:right}.who b{font-size:22px;font-weight:900}.who span{display:block;color:var(--sub);font-size:13px;margin-top:2px;white-space:nowrap}
.sec{margin-top:20px}.sec h3{font-size:14px;font-weight:800;color:var(--sub);letter-spacing:.04em;margin:0 0 9px}
.big{display:flex;gap:10px}.stat{flex:1;background:var(--accent2);border-radius:14px;padding:12px 14px;min-width:0}

.bars .tr{flex:1;height:13px;background:#efeae1;border-radius:7px;overflow:hidden}.bars .f{height:100%;background:var(--accent);border-radius:7px}.bars .f.w{background:var(--warn)}
.bars .v{width:46px;text-align:right;font-weight:800;font-size:14.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;color:var(--warn);background:var(--warnbg);border-radius:6px;padding:1px 6px;margin-left:5px}
.note3{display:flex;gap:9px}.note3 div{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px}
.note3 b{font-size:22px;font-weight:900}.note3 span{display:block;font-size:12.5px;color:var(--sub)}

.memo b{color:var(--gold);font-size:12.5px;display:block;margin-bottom:3px;letter-spacing:.04em}
.line{margin-top:10px;font-size:14px;line-height:1.6}.line b{color:var(--accent)}
.none{font-size:14px;color:var(--sub);padding:4px 0}
.hint{font-size:12.5px;color:var(--sub);margin-top:6px}
.ex .ok{color:var(--accent)}.ex .ng{color:var(--warn)}.ex .dn{font-weight:800}
.foot{margin-top:18px;font-size:11.5px;color:var(--sub);text-align:center}

#ov{position:fixed;inset:0;background:rgba(15,20,30,.86);z-index:20;display:none;overflow:auto;padding:16px}
#ov .in{max-width:520px;margin:0 auto;color:#fff;text-align:center}
#ov img{width:100%;border-radius:12px;margin:10px 0 4px;display:block}
#ov a,#ov button{display:inline-block;margin:4px;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:800;background:#fff;color:var(--navy);text-decoration:none}
#ov p{font-size:13px;color:#d6dbe8;margin:4px 0 14px}
#shot{position:fixed;left:-10000px;top:0;width:760px}
@media(max-width:560px){.card{padding:20px 16px 18px}.rc{padding:10px}.top h2{font-size:22px}.stat .n{font-size:21px}.bars .k{width:120px;font-size:13px}.who b{font-size:19px}}
